<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exillion Capital</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

<style>

html { scroll-behavior: smooth; }
body {
  margin:0;
  font-family:'Orbitron',sans-serif;
  background:#010b18;
  color:white;
  overflow:hidden;
}

/* SPLASH */
#main-splash{
  position:fixed;inset:0;
  background:#010b18;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

/* TITLE */
h1{
  font-size:clamp(2.5rem,6vw,5rem);
  letter-spacing:10px;
}

.gradient-text{
  background: linear-gradient(90deg,#00d4ff,#0066ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* BUTTON */
.enter-btn{
  margin-top:20px;
  padding:14px 26px;
  border:1px solid rgba(0,212,255,0.3);
  background:transparent;
  color:white;
  cursor:pointer;
  transition:all .3s ease;
}

.enter-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 0 20px rgba(0,212,255,0.4);
}

/* REVEAL */
.reveal{
  opacity:0;
  transform:translateY(30px);
  transition:all .8s ease;
}
.reveal.visible{
  opacity:1;
  transform:translateY(0);
}

/* MOBILE ONLY */
@media(max-width:600px){
  h1{font-size:2rem;letter-spacing:5px}
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="main-splash">
  <div>
    <h1 class="gradient-text">EXILLION</h1>
    <button class="enter-btn" onclick="enterSite()">ENTER</button>
  </div>
</div>

<!-- MAIN -->
<div style="padding:100px 20px">
  <h1 class="reveal">Welcome</h1>
  <p class="reveal">Decentralized Capital Engine</p>
</div>

<script>

function enterSite(){
  const splash=document.getElementById('main-splash');
  splash.style.opacity='0';
  setTimeout(()=>{
    splash.style.display='none';
    document.body.style.overflow='auto';
  },800);
}

// reveal
const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('visible');
    }
  });
});

document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

</script>

</body>
</html>
